  BaseObservationValueEnum:
    description: Constrainted values to be used in value_enums for Observations
    inherits:
      - EducationalAttainmentObservationTypeEnum
      - SmokingStatusObservationTypeEnum

  RelativeTimingEnum:
    description: A constrained set of enumerative values describing the relative timing of an activity.
    permissible_values:
      AFTER:
        description: Occurring later than
      BEFORE:
        description: Occurring prior to
      CONCURRENT_WITH:
        description: Occurring simultaneous to

  MeasuredByPersonnelTypeEnum:
    description: A constrained set of enumerative values describing the type of personnel performing a measurement.
    permissible_values:
      PHYSICIAN:
        description: A medical doctor (MD) or doctor of osteopathic medicine (DO) who is licensed to practice medicine and provide healthcare services.
      NURSE:
        description: A registered nurse (RN), licensed practical nurse (LPN), or other nursing professional who provides patient care and support under the supervision of a physician or independently within their scope of practice.
      TECHNICIAN:
        description: A healthcare worker trained to perform specific technical tasks, such as laboratory tests, imaging procedures, or medical equipment operation, but who does not have the full scope of practice of a physician or nurse.
      OTHER_HEALTHCARE_PROFESSIONAL:
        description: Any other type of healthcare professional involved in performing an activity, such as a physical therapist, occupational therapist, pharmacist, or social worker.

  ActivityTypeEnum:
    description: A constrained set of enumerative values describing types of activities.
    permissible_values:
      FASTING:
        description: Abstaining from intake of food or liquid
      BRONCHODILATOR_MEDICATION_USE:
        description: The act of taking one or more medication in the class of "bronchodilators"
      DIABETES_MEDICATION_USE:
        description: The act of taking one or more medication used in control of diabetes
      ANTIHYPERLIPIDEMICS_MEDICATION_USE:
        description: The act of taking one or more medication in the class of "antihyperlipidemics"
      PHYSICAL_ACTIVITY:
        description: The act of engaging in aerobic movement (e.g., brisk walking, running)
      MEDICAL_PROCEDURE:
        description: A therapeutic or diagnostic procedure undertaken in the context of healthcare or research

  MeasurementQualifierEnum:
    description: A constrained set of enumerative values describing qualifiers of a measurement.
    permissible_values:
      AVERAGE:
        description: An average of measurements taken across a time period or under specific conditions
      MINIMUM:
        description: The minimum value among measurements taken across a time period or under specific conditions
      MAXIMUM:
        description: The maximum value among measurements taken across a time period or under specific conditions
      SUM:
        description: The sum of measurements taken across a time period or under specific conditions
      FIRST_MEASUREMENT:
        description: The first measurement taken in a series of measurements across a time period or under specific conditions
      LAST_MEASUREMENT:
        description: The last measurement taken in a series of measurements across a time period or under specific conditions

  QuantityOperatorEnum:
    description: A constrained set of enumerative values describing operators that can be applied to a quantity.
    permissible_values:
      LESS_THAN:
        description: The quantity is less than a specified value
        meaning: OMOP:4171756
      LESS_THAN_OR_EQUAL_TO:
        description: The quantity is less than or equal to a specified value
        meaning: OMOP:4171754
      EQUAL_TO:
        description: The quantity is equal to a specified value
        meaning: OMOP:4172703
      GREATER_THAN_OR_EQUAL_TO:
        description: The quantity is greater than or equal to a specified value
        meaning: OMOP:4171755
      GREATER_THAN:
        description: The quantity is greater than a specified value
        meaning: OMOP:4172704

  SdohEnum:
    description: A constrained set of enumerative values describing social determinants of health measurement variables.
    permissible_values:
      FAMILY_INCOME:
        description: The sum of the income of all family members 15 years and older living in the household over 12 months, before taxes
        meaning: OMOP:4076114
      EDUCATIONAL_ATTAINMENT:
        description: The highest level of education that an individual has completed
        meaning: OMOP:4022643
