      STUDY:
        description: Study

  BodyPositionEnum:
    description: Values describing the body position of a patient during a measurement or observation.
    permissible_values:
      SITTING_POSITION:
        description: The patient is in a sitting position during the measurement or observation.
        meaning: OMOP:4142787
      ORTHOSTATIC_BODY_POSITION:
