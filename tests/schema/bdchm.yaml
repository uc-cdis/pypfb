  VisitCategoryEnum:
    description: >-
      A constrained set of enumerative values containing the OMOP values for visit categories.
    permissible_values:
      ALTERNATE_CARE_SITE_ACS:
        description: Person receiving care at a temporary or non-traditional care site established to expand capacity, such as during a public health emergency
        meaning: OMOP:33007
      AMBULANCE_VISIT:
        description: Person using transportation service for the purpose of initiating one of the other Visits, without a Care Site, within one day, potentially with Providers accompanying the Visit and delivering service
        meaning: OMOP:581478
      AMBULATORY_LONG_COVID_CLINIC:
        description: Person visiting a specialized outpatient clinic dedicated to the assessment and management of persistent post-COVID-19 symptoms
        meaning: OMOP:705159
      AMBULATORY_REHABILITATION_VISIT:
        description: Person visiting a Care Site within one day for the purpose of receiving rehabilitative therapy services without overnight admission
        meaning: OMOP:581479
      EMERGENCY_ROOM_AND_INPATIENT_VISIT:
        description: Person visiting ER followed by a subsequent Inpatient Visit, where Emergency department is part of hospital, and transition from the ER to other hospital departments is undefined
        meaning: OMOP:262
      EMERGENCY_ROOM_VISIT:
        description: Person visiting dedicated healthcare institution for treating emergencies, at a Care Site, within one day, with physicians and Providers permanently available to deliver service around the clock
        meaning: OMOP:9203
      HEALTH_EXAMINATION:
        description: Person visiting a Care Site within one day for a routine or preventive health assessment, without an acute presenting complaint
        meaning: OMOP:32693
      HOME_ISOLATION:
        description: Person remaining at home and separated from others for the purpose of containing or managing an infectious or potentially infectious condition
        meaning: OMOP:32759
      HOME_VISIT:
        description: Provider visiting Person, without a Care Site, within one day, delivering service
        meaning: OMOP:581476
      INPATIENT_VISIT:
        description: Person visiting hospital, at a care site, in bed, for duration of more than one day, with physicians and other Providers permanently available to deliver service around the clock
        meaning: OMOP:9201
      INTENSIVE_CARE:
        description: Person admitted to a specialized hospital unit for more than one day, receiving continuous monitoring and advanced life-support from dedicated Providers
        meaning: OMOP:32037
      ISOLATION_IN_INPATIENT_SETTING:
        description: Person admitted to a hospital and physically separated from other patients to prevent transmission of an infectious or potentially infectious condition
        meaning: OMOP:32760
      LABORATORY_VISIT:
        description: Patient visiting dedicated institution, at a Care Site, within one day, for the purpose of a Measurement.
        meaning: OMOP:32036
      NON_HOSPITAL_INSTITUTION_VISIT:
        description: Person visiting dedicated institution for reasons of poor health, at a Care Site, long-term or permanently, with no physician but possibly other Providers permanently available to deliver service around the clock
        meaning: OMOP:42898160
      OFFICE_VISIT:
        description: Person visiting a Provider at a Care Site within one day for evaluation or management of a health concern, without bed or overnight stay
        meaning: OMOP:581477
      OUTPATIENT_VISIT:
        description: Person visiting dedicated ambulatory healthcare institution, at a Care Site, within one day, without bed, with physicians or medical Providers delivering service during Visit
        meaning: OMOP:9202
      PERSON_UNDER_INVESTIGATION_PUI:
        description: Person being monitored or assessed at a Care Site due to potential exposure to or symptoms of a reportable or emerging infectious disease
        meaning: OMOP:32761
      PHARMACY_VISIT:
        description: Person visiting pharmacy for dispensing of Drug, at a Care Site, within one day
        meaning: OMOP:581458
      STUDY_SITE_VISIT:
        description: Person visiting a clinic for study-specific data collection or other reasons
      SUPPLIER_SERVICE_PROVIDER:
        description: Person receiving goods or services from a non-clinical supplier or durable medical equipment provider, outside of a traditional Care Site encounter
        meaning: OMOP:33004
      TELEHEALTH:
        description: Patient engages with Provider through communication media
        meaning: OMOP:722455
      UNKNOWN:
        description: Visit category is not known, not observed, not recorded, or refused.
        meaning: OMOP:8552

